[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "chinese_converter",
    "anime1_downloader",
    "image_tool",
    "ytmusic_dl",
]

[project]
name = "useful-tools"
version = "0.1.0"
description = "A collection of useful tools."
requires-python = ">=3.10"
# Core dependencies needed by all tools
dependencies = [
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",  # Required on Windows for zoneinfo timezone support
]

[dependency-groups]
# Development dependencies
dev = [
    "ruff>=0.14.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

# Dependencies for the chinese_converter tool
chinese_converter = [
    "opencc-python-reimplemented~=0.1.7",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.14.3",
]

# Dependencies for the anime1_downloader tool
anime1_downloader = [
    "requests>=2.34.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=4.9.0",
    "yt-dlp>=2026.10.21",
    "rich>=15.0.0",
]

# Dependencies for the image_tool
image_tool = [
    "opencv-python>=5.0.0.93",
]

# Dependencies for the ytmusic_dl tool
ytmusic_dl = [
    "yt-dlp>=2026.10.21",
    "yt-dlp-ejs>=0.8.0",
    "mutagen>=1.48.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "A"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
  "E501", # line too long, handled by black
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [
    "anime1_downloader/tests",
    "chinese_converter/tests",
    "image_tool/tests",
    "ytmusic_dl/tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = [
    "anime1_downloader",
    "chinese_converter",
    "image_tool",
    "ytmusic_dl",
]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
